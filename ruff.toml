# Ruff config for the Python 2 -> Python 3 port of siFi.
# `legacy/` is the frozen Python 2 original and is excluded wholesale: ruff cannot
# parse Python 2 syntax, so linting it would only report syntax errors.
# `tests/py2_capture/` must keep running under Python 2.7 to regenerate the golden
# fixtures, so the `UP` rules must not be applied to it either.

target-version = "py311"
line-length = 120

exclude = [
    "legacy",
    "ToCopy",
    "tests/py2_capture",
    # Generated by pyuic5/pyrcc5 from the .ui and .qrc files beside them; the
    # sources are what gets edited, so linting the output is noise.
    "src/sifi2/gui/resources/ui_*.py",
    "src/sifi2/gui/resources/sifi_2015_rc.py",
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "UP",       # pyupgrade — flags the Py2-era constructs this port needs to remove
    "B",        # bugbear
    "SIM",      # simplify
    "I",        # import sorting
]
ignore = [
    "E501",     # line length is enforced by the formatter, not the linter
]

[format]
quote-style = "double"
