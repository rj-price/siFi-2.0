[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sifi2"
version = "2.0.0.dev0"
description = "siFi 2.0 — long dsRNA RNAi-target design and off-target prediction"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-2.0"
authors = [
    { name = "Stefanie Lück" },
    { name = "Jordan Price" },
]
keywords = ["RNAi", "dsRNA", "siRNA", "off-target", "bioinformatics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython",
    "numpy",
    "matplotlib",
    "seaborn",
    "pandas",
    "platformdirs",
]

[project.optional-dependencies]
gui = ["PyQt5"]
test = ["pytest", "pytest-cov"]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/rj-price/siFi-2.0"
Upstream = "https://github.com/snowformatics/siFi21-"
Publication = "https://doi.org/10.3389/fpls.2019.01023"

[project.scripts]
sifi = "sifi2.cli:main"
sifi-gui = "sifi2.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The GUI's Qt sources ship alongside the modules generated from them, so the
# generated files can always be regenerated from an installed copy.
[tool.setuptools.package-data]
"sifi2.gui.resources" = ["*.ui", "*.qrc", "Images/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
